<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoogleRAG — спроси документы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #0e0f11;
    --surface:  #17191d;
    --border:   #2a2d35;
    --accent:   #c8a96e;
    --accent2:  #7ec8c8;
    --text:     #e8e6e0;
    --muted:    #6b6f7a;
    --user-bg:  #1e2028;
    --bot-bg:   #141618;
    --danger:   #e07070;
    --radius:   12px;
  }
  html, body { height: 100%; font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text); overflow: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events: none; z-index: 0; }
  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 20px 28px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .logo { display: flex; align-items: baseline; gap: 10px; }
  .logo-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
  .logo-tag { font-size: 0.65rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 500; padding: 2px 7px; border: 1px solid var(--accent); border-radius: 20px; opacity: 0.85; }
  .status-wrap { display: flex; align-items: center; gap: 7px; }
  .status-label { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.06em; transition: color 0.3s; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4caf7d; box-shadow: 0 0 6px #4caf7d88; transition: background 0.3s, box-shadow 0.3s; flex-shrink: 0; }
  .status-dot.thinking { background: var(--accent); box-shadow: 0 0 6px var(--accent)88; animation: pulse 1.2s ease-in-out infinite; }
  .status-dot.error { background: var(--danger); box-shadow: 0 0 6px var(--danger)88; animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .messages { flex: 1; overflow-y: auto; padding: 28px 28px 8px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); text-align: center; pointer-events: none; user-select: none; padding-bottom: 40px; }
  .empty-icon { font-size: 2.6rem; opacity: 0.35; line-height: 1; }
  .empty-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--text); opacity: 0.45; font-weight: 400; }
  .empty-sub { font-size: 0.7rem; letter-spacing: 0.04em; max-width: 260px; line-height: 1.8; opacity: 0.7; }
  .msg { display: flex; flex-direction: column; gap: 5px; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-items: flex-end; }
  .msg.bot  { align-items: flex-start; }
  .msg-meta { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.07em; padding: 0 4px; }
  .msg-bubble { max-width: 86%; padding: 12px 16px; border-radius: var(--radius); font-size: 0.84rem; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .msg.user .msg-bubble { background: var(--user-bg); border: 1px solid var(--border); color: var(--text); border-bottom-right-radius: 3px; }
  .msg.bot  .msg-bubble { background: var(--bot-bg); border: 1px solid var(--border); border-left: 2px solid var(--accent2); color: var(--text); border-bottom-left-radius: 3px; }
  .msg.error .msg-bubble { border-left-color: var(--danger); color: var(--danger); font-size: 0.78rem; }
  .typing-indicator { display: flex; align-items: center; gap: 5px; padding: 13px 16px; background: var(--bot-bg); border: 1px solid var(--border); border-left: 2px solid var(--accent2); border-radius: var(--radius); border-bottom-left-radius: 3px; width: fit-content; }
  .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent2); animation: typingBounce 1.2s ease-in-out infinite; opacity: 0.6; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-5px); opacity: 1; } }
  .input-area { padding: 16px 28px 24px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.84rem; line-height: 1.6; padding: 12px 16px; resize: none; outline: none; max-height: 140px; min-height: 48px; overflow-y: auto; transition: border-color 0.2s; }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }
  .send-btn { width: 48px; height: 48px; background: var(--accent); color: #0e0f11; border: none; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.2s, transform 0.15s; }
  .send-btn:hover:not(:disabled) { opacity: 0.82; transform: scale(1.04); }
  .send-btn:active:not(:disabled) { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .input-hint { font-size: 0.6rem; color: var(--muted); margin-top: 8px; letter-spacing: 0.04em; }
  @media (max-width: 520px) {
    header, .messages, .input-area { padding-left: 16px; padding-right: 16px; }
    .msg-bubble { max-width: 95%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <span class="logo-title">Goglik</span>
      <span class="logo-tag">RAG</span>
    </div>
    <div class="status-wrap">
      <span class="status-label" id="statusLabel">готов</span>
      <div class="status-dot" id="statusDot"></div>
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">◈</div>
      <div class="empty-title">Спроси что-нибудь</div>
      <div class="empty-sub">Отвечаю на вопросы по загруженным документам</div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea
        id="userInput"
        placeholder="Введи вопрос..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Отправить">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="input-hint">Enter — отправить &nbsp;·&nbsp; Shift+Enter — перенос строки</div>
  </div>
</div>

<script>
  const WEBHOOK_URL = 'https://brouski1.app.n8n.cloud/webhook/2049701c-0447-4fe9-a300-c2a56856c723';

  let isLoading = false;

  const messagesEl  = document.getElementById('messages');
  const emptyState  = document.getElementById('emptyState');
  const inputEl     = document.getElementById('userInput');
  const sendBtn     = document.getElementById('sendBtn');
  const statusDot   = document.getElementById('statusDot');
  const statusLabel = document.getElementById('statusLabel');

  // Стабильный ID сессии — живёт пока открыта вкладка
  // Позволяет n8n вести память разговора для каждого пользователя отдельно
  function getSessionId() {
    let id = sessionStorage.getItem('goglik_sid');
    if (!id) {
      id = 'web_' + Math.random().toString(36).slice(2, 10);
      sessionStorage.setItem('goglik_sid', id);
    }
    return id;
  }

  function setStatus(state) {
    const map = {
      '':         { label: 'готов',     cls: '' },
      'thinking': { label: 'думает...', cls: 'thinking' },
      'error':    { label: 'ошибка',    cls: 'error' },
    };
    const s = map[state] ?? map[''];
    statusLabel.textContent = s.label;
    statusDot.className = 'status-dot' + (s.cls ? ` ${s.cls}` : '');
  }

  function ts() {
    return new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function addMessage(text, role) {
    emptyState.style.display = 'none';

    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent =
      role === 'user'  ? `вы · ${ts()}` :
      role === 'error' ? `ошибка · ${ts()}` :
                         `ответ · ${ts()}`;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    wrap.appendChild(meta);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollBottom();
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typingWrap';

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = 'думает...';

    const ind = document.createElement('div');
    ind.className = 'typing-indicator';
    ind.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

    wrap.appendChild(meta);
    wrap.appendChild(ind);
    messagesEl.appendChild(wrap);
    scrollBottom();
  }

  function removeTyping() {
    document.getElementById('typingWrap')?.remove();
  }

  function scrollBottom() {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
  }

  async function sendMessage() {
    if (isLoading) return;

    const text = inputEl.value.trim();
    if (!text) { inputEl.focus(); return; }

    inputEl.value = '';
    inputEl.style.height = 'auto';
    inputEl.focus();

    addMessage(text, 'user');
    showTyping();

    isLoading = true;
    sendBtn.disabled = true;
    setStatus('thinking');

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text,
          sessionId: getSessionId()
        })
      });

      removeTyping();

      if (!res.ok) throw new Error(`HTTP ${res.status} — ${res.statusText}`);

      const contentType = res.headers.get('content-type') || '';
      let answer;

      if (contentType.includes('application/json')) {
        const data = await res.json();
        // Пробуем стандартные поля n8n / LangChain
        answer =
          data?.response ??
          data?.output   ??
          data?.text     ??
          data?.answer   ??
          data?.message  ??
          (typeof data === 'string' ? data : JSON.stringify(data, null, 2));
      } else {
        answer = (await res.text()).trim() || '(пустой ответ)';
      }

      addMessage(answer, 'bot');
      setStatus('');

    } catch (err) {
      removeTyping();
      addMessage(`Не удалось получить ответ.\n${err.message}`, 'error');
      setStatus('error');
      setTimeout(() => setStatus(''), 4000);
    } finally {
      isLoading = false;
      sendBtn.disabled = false;
    }
  }
</script>
</body>
</html>
